plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.qqenhanced.bypass'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.qqenhanced.bypass"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.7"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    // 启用 prefab，让 CMake 能通过 find_package 找到 ByteHook 的预编译库
    buildFeatures {
        prefab true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    // 使用官方 Xposed API 仓库
    compileOnly 'de.robv.android.xposed:api:82:sources'
    compileOnly 'de.robv.android.xposed:api:82'

    // ByteHook - 字节跳动 PLT hook 框架（预编译 AAR，含 prefab 供 CMake 使用）
    implementation 'com.bytedance:bytehook:1.0.2'

    // DexKit - 高性能 dex 字节码搜索库，用于动态定位混淆后的检测点
    implementation 'org.luckypray:dexkit:2.0.0'
}
